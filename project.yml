name: ClaudeAlertBot
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
targets:
  ClaudeAlertBot:
    type: application
    platform: macOS
    sources:
      - path: App
        name: App
    info:
      path: App/Info.plist
      properties:
        CFBundleIdentifier: com.claudealert.bot
        CFBundleName: Claude Alert Bot
        LSMinimumSystemVersion: "14.0"
        LSUIElement: true
        NSAppleEventsUsageDescription: "Claude Alert Bot이 iTerm2의 현재 탭을 확인해서 이미 보고 있는 작업의 알림을 끄고, 클릭 시 정확한 탭으로 이동하기 위해 사용합니다."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.claudealert.bot
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: YES
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
    dependencies:
      - target: cab-test
        embed: false
        link: false
    postBuildScripts:
      - name: "Embed cab-test helper into Contents/MacOS"
        script: |
          SRC="${BUILT_PRODUCTS_DIR}/cab-test"
          DEST="${TARGET_BUILD_DIR}/${EXECUTABLE_FOLDER_PATH}/cab-test"
          if [ -f "$SRC" ]; then
              cp "$SRC" "$DEST"
              chmod +x "$DEST"
              codesign --force --sign - "$DEST" 2>/dev/null || true
          fi
        shell: /bin/sh
      - name: "Embed Reporter shell script"
        script: |
          SRC="${SRCROOT}/Reporter/cab-report.sh"
          DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/cab-report.sh"
          if [ -f "$SRC" ]; then
              mkdir -p "$(dirname "$DEST")"
              cp "$SRC" "$DEST"
              chmod +x "$DEST"
          fi
        shell: /bin/sh
      - name: "Embed Zelda widget assets"
        script: |
          SRC="${SRCROOT}/zelda"
          DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/zelda"
          if [ -d "$SRC" ]; then
              rm -rf "$DEST"
              mkdir -p "$DEST"
              cp -R "$SRC"/. "$DEST"/
              find "$DEST" -name .DS_Store -delete
          fi
        shell: /bin/sh
  cab-test:
    type: tool
    platform: macOS
    sources:
      - path: CabTest
        name: CabTest
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ""
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: YES
  ClaudeAlertBotTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ClaudeAlertBotTests
        name: ClaudeAlertBotTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ClaudeAlertBot.app/Contents/MacOS/ClaudeAlertBot"
    dependencies:
      - target: ClaudeAlertBot
schemes:
  ClaudeAlertBot:
    build:
      targets:
        ClaudeAlertBot: all
        cab-test: all
        ClaudeAlertBotTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ClaudeAlertBotTests
    archive:
      config: Release
